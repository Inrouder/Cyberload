name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_BIN: ./Godot_v4.4.1-stable_linux.x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --licenses <<< "$(yes y | head -n 100)" || true

      - name: Install Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "$GODOT_BIN"
          curl --fail --location --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz
          cp -a templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Prepare Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Cyberload,C=DE"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK and Java paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify Android export prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.config/godot/editor_settings-4.4.tres"
          test -d "$ANDROID_HOME/build-tools"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$HOME/.android/debug.keystore"
          ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Generate Cyberload Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet cairosvg
          python3 tools/make_icons.py
          test -s assets/icon-main-192.png
          test -s assets/icon-foreground-432.png
          test -s assets/icon-background-432.png

      - name: Validate Godot import and scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --import --quit 2>&1 | tee godot-import.log
          "$GODOT_BIN" --headless --path . --quit-after 3 2>&1 | tee godot-smoke.log
          if grep -iE "SCRIPT ERROR|Parse Error|Failed to load script" godot-import.log godot-smoke.log; then
            exit 1
          fi

      - name: Verify world transitions
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/world_smoke.gd
      - name: Verify crafting, save data and rhythm combat
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/progression_smoke.gd 2>&1 | tee progression-smoke.log
          grep -q "CYBERLOAD PROGRESSION TEST PASS" progression-smoke.log

      - name: Verify pixel VFX and developer damage
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/fx_smoke.gd
      - name: Verify world geography, mining and dungeons
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/open_world_smoke.gd
      - name: Mesh block editor, progression and enemy tests
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/mesh_smoke.gd
      - name: Mesh steering, inertia and wall physics
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/mesh_physics_smoke.gd
      - name: Red Zone integration tests
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/red_zone_smoke.gd
      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug Android build/Cyberload-debug.apk 2>&1 | tee godot-export.log
          test -s build/Cyberload-debug.apk

      - name: Validate APK file
        shell: bash
        run: |
          set -euo pipefail
          unzip -t build/Cyberload-debug.apk > /dev/null
          ls -lh build/Cyberload-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyberload-debug-apk
          path: build/Cyberload-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cyberload-build-logs
          path: |
            godot-import.log
            godot-smoke.log
            godot-export.log
            progression-smoke.log
          if-no-files-found: ignore
