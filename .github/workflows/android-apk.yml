name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.4.1 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 4 -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          rm -rf templates

      - name: Import and validate project
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit

      - name: Export debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p build
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug "Android" build/Cyberload-debug.apk
          test -s build/Cyberload-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyberload-debug-apk
          path: build/Cyberload-debug.apk
          if-no-files-found: error
          retention-days: 30
